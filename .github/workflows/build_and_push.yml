name: Build & push custom image (EE) to GHCR

# Builds the Enterprise-edition production image (keeps enterprise/ code) for
# linux/amd64 and pushes it to GHCR with an immutable tag. Trigger manually from
# the Actions tab (Run workflow). The resulting image tag is printed in the run
# summary — use that exact tag in the Portainer stack.

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - name: Require successful custom checks for this commit
        uses: actions/github-script@v7
        with:
          script: |
            const required = ['lint-backend', 'lint-frontend', 'frontend-tests', 'backend-tests'];
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              ...context.repo,
              workflow_id: 'custom_checks.yml',
              head_sha: context.sha,
              per_page: 100,
            });
            const run = runs.filter(item => item.head_sha === context.sha).sort((a, b) => b.id - a.id)[0];
            if (!run || run.status !== 'completed' || run.conclusion !== 'success') {
              core.setFailed(`Image publication blocked: Custom checks must pass for ${context.sha} before building.`);
              return;
            }
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              ...context.repo,
              run_id: run.id,
              filter: 'latest',
              per_page: 100,
            });
            const failures = required.filter(name => !jobs.some(job =>
              job.name === name && job.status === 'completed' && job.conclusion === 'success'
            ));
            if (failures.length) {
              core.setFailed(`Image publication blocked: missing or unsuccessful checks for ${context.sha}: ${failures.join(', ')}`);
            }

      - name: Compute immutable tag
        run: echo "TAG=ee-$(date +%Y%m%d)-$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Set Chatwoot edition to enterprise
        run: echo -en '\nENV CW_EDITION="ee"' >> docker/Dockerfile

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            RAILS_ENV=production
            BUNDLE_WITHOUT=development:test
          tags: ${{ env.IMAGE }}:${{ env.TAG }}

      - name: Summary
        run: |
          echo "### Image published :rocket:" >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo "Use this exact tag in Portainer (chatwoot_app + chatwoot_sidekiq):" >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ env.IMAGE }}:${{ env.TAG }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
